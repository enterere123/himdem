<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Химический диктант</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #9d00ff;
            --neon-green: #00ff88;
            --bg-dark: #0a0a0f;
            --card-bg: #12121a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 60%),
                        radial-gradient(circle at 80% 20%, rgba(255, 0, 255, 0.05) 0%, transparent 50%);
            animation: bgPulse 10s infinite alternate;
            z-index: 0;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            padding: 20px;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        /* МЕНЮ */
        .menu-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 40px var(--neon-purple);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .menu-desc {
            font-size: 1.1rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .btn-start {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: #fff;
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3), inset 0 0 15px rgba(255, 0, 255, 0.3);
        }

        .btn-start:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 30px var(--neon-pink), 0 0 60px var(--neon-pink);
            transform: translateY(-3px);
        }

        /* ИГРА */
        .game-screen {
            justify-content: flex-start;
            padding-top: 10px;
        }

        .header-stats {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(18, 18, 26, 0.8);
            border-radius: 15px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
            margin-bottom: 20px;
        }

        .timer, .score {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timer i, .score i {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            font-style: normal;
        }

        .timer i.paused {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        /* КАРТОЧКА */
        .card-area {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            height: 350px;
            background: var(--card-bg);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
            cursor: grab;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), 0 0 40px rgba(157, 0, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
            padding: 20px;
            will-change: transform;
            z-index: 10;
        }

        .card:active { cursor: grabbing; }

        .card.swiping {
            transition: none;
            box-shadow: 0 0 30px var(--neon-pink), 0 0 60px var(--neon-purple);
        }

        .card.swiped-right {
            transform: translateX(150%) rotate(15deg) !important;
            opacity: 0;
        }

        .card.hint {
            animation: cardHint 2s ease-in-out infinite;
        }

        @keyframes cardHint {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(15px); }
        }

        .card-label {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card-content {
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .swipe-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .swipe-overlay.right {
            background: linear-gradient(90deg, transparent, rgba(0, 255, 100, 0.2));
            box-shadow: inset 0 0 50px rgba(0, 255, 100, 0.4);
            opacity: 1;
        }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-panel {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px 0 10px;
            gap: 15px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .btn-control {
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid var(--neon-blue);
            background: transparent;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            flex: 1;
            max-width: 200px;
            text-align: center;
        }

        .btn-control:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 30px var(--neon-blue);
            transform: translateY(-2px);
        }

        .btn-control.secondary {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
        }

        .btn-control.secondary:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .btn-control:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Результат */
        .result-grade {
            font-size: 5rem;
            font-weight: 700;
            color: #fff;
            margin: 10px 0;
            animation: gradePop 0.6s ease-out;
            line-height: 1;
        }

        @keyframes gradePop {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .grade-2 { color: #ff3355; text-shadow: 0 0 20px #ff3355, 0 0 40px #ff3355; }
        .grade-3 { color: #ffaa00; text-shadow: 0 0 20px #ffaa00, 0 0 40px #ffaa00; }
        .grade-4 { color: #00f3ff; text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff; }
        .grade-5 { color: #00ff88; text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88; }

        .result-score {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 15px;
        }

        .result-label {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        /* Частицы */
        .particle {
            position: absolute;
            background: var(--neon-blue);
            border-radius: 50%;
            opacity: 0.3;
            filter: blur(1px);
            animation: particleFloat linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        @media (min-width: 768px) {
            .app-container {
                height: 90vh;
                border-radius: 20px;
                box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.05);
                background: rgba(10, 10, 15, 0.8);
                backdrop-filter: blur(10px);
            }
        }

        .hidden-btn { display: none !important; }
    </style>
</head>
<body>

    <div id="particles"></div>

    <div class="app-container">

        <div class="screen" id="menuScreen">
            <div class="menu-title">ХИМИЯ<br>ДИКТАНТ</div>
            <div class="menu-desc">Свайпай вправо, чтобы пропустить карточку. Успей за 1 минуту!</div>
            <button class="btn-start" id="startBtn">Начать</button>
        </div>

        <div class="screen game-screen hidden" id="gameScreen">
            
            <div class="header-stats">
                <div class="timer"><i id="timerIcon">⏱</i> <span id="timerText">01:00</span></div>
                <div class="score"><i>✓</i> <span id="scoreText">0</span></div>
            </div>

            <div class="card-area">
                <div class="card hint" id="card">
                    <div class="card-label" id="cardLabel">Свайпни вправо</div>
                    <div class="swipe-overlay" id="swipeOverlay"></div>
                    <div class="card-content" id="cardContent">
                        <div id="formula">H₂SO₄</div>
                    </div>
                </div>
            </div>

            <div class="bottom-panel" id="bottomPanel">
                <button class="btn-control" id="pauseBtn">Пауза</button>
                <button class="btn-control secondary hidden-btn" id="resumeBtn">Продолжить</button>
                <button class="btn-control secondary hidden-btn" id="restartBtn">Заново</button>
            </div>

        </div>
    </div>

    <script>
        const compounds = [
            { formula: "H₂SO₄" },
            { formula: "Sr₃(PO₄)₂" },
            { formula: "CaF₂" },
            { formula: "Ca(OH)₂" },
            { formula: "H₂SiO₃" },
            { formula: "ZnCO₃" },
            { formula: "PbI₂" },
            { formula: "K₂SiO₃" },
            { formula: "P₂O₅" },
            { formula: "Li₃PO₄" },
            { formula: "CaCl₂" },
            { formula: "Fe₂(SO₄)₃" },
            { formula: "PbCO₃" },
            { formula: "Ba(OH)₂" },
            { formula: "Fe(OH)₃" },
            { formula: "MgBr₂" },
            { formula: "K₃PO₄" },
            { formula: "H₂CO₃" },
            { formula: "Li₂SO₄" },
            { formula: "(NH₄)₂SO₄" },
            { formula: "CaCO₃" },
            { formula: "LiOH" },
            { formula: "Na₂S" },
            { formula: "H₂O" },
            { formula: "KNO₂" },
            { formula: "CaI₂" },
            { formula: "PbSO₄" },
            { formula: "Ag₂CO₃" },
            { formula: "SO₃" },
            { formula: "BaCO₃" },
            { formula: "H₃PO₄" },
            { formula: "HCl" },
            { formula: "H₂S" },
            { formula: "BaSO₄" },
            { formula: "Na₂SO₄" },
            { formula: "AgNO₃" },
            { formula: "HNO₃" },
            { formula: "NaCl" },
            { formula: "Pb(NO₃)₂" },
            { formula: "SiO₂" },
            { formula: "NH₄Br" },
            { formula: "NO₂" },
            { formula: "NaOH" },
            { formula: "AgI" },
            { formula: "MgO" },
            { formula: "Mn₃(PO₄)₂" },
            { formula: "H₂SO₃" },
            { formula: "FeS" },
            { formula: "SrSO₄" },
            { formula: "CuF₂" },
            { formula: "AlPO₄" },
            { formula: "Al(OH)₃" },
            { formula: "Mg₃(PO₄)₂" },
            { formula: "FeSO₄" },
            { formula: "FeF₂" },
            { formula: "(NH₄)₂S" },
            { formula: "Al₂O₃" },
            { formula: "CO₂" },
            { formula: "FeCl₃" },
            { formula: "Cu₃(PO₄)₂" },
            { formula: "FeF₃" },
            { formula: "Na₂O" },
            { formula: "CaSO₄" },
            { formula: "Mn(NO₃)₂" }
        ];

        let deck = [];
        let currentIndex = 0;
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let isPaused = false;
        let isGameActive = false;
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        const menuScreen = document.getElementById('menuScreen');
        const gameScreen = document.getElementById('gameScreen');
        const startBtn = document.getElementById('startBtn');
        const card = document.getElementById('card');
        const cardContent = document.getElementById('cardContent');
        const cardLabel = document.getElementById('cardLabel');
        const timerText = document.getElementById('timerText');
        const timerIcon = document.getElementById('timerIcon');
        const scoreText = document.getElementById('scoreText');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const restartBtn = document.getElementById('restartBtn');
        const swipeOverlay = document.getElementById('swipeOverlay');

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 4 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 10 + 8) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.background = Math.random() > 0.5 ? '#00f3ff' : '#ff00ff';
                container.appendChild(p);
            }
        }
        createParticles();

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function getGrade(score) {
            if (score < 10) return 2;
            if (score < 31) return 3;
            if (score < 42) return 4;
            return 5;
        }

        function startGame() {
            deck = shuffleArray([...compounds]);
            currentIndex = 0;
            score = 0;
            timeLeft = 60;
            isPaused = false;
            isGameActive = true;
            
            scoreText.textContent = '0';
            updateTimerDisplay();
            
            pauseBtn.classList.remove('hidden-btn');
            resumeBtn.classList.add('hidden-btn');
            restartBtn.classList.add('hidden-btn');
            pauseBtn.disabled = false;
            timerIcon.classList.remove('paused');
            timerIcon.textContent = '⏱';
            
            card.style.transition = 'none';
            card.style.transform = 'translateX(0) rotate(0)';
            card.style.opacity = '1';
            card.classList.remove('swiped-right');
            card.classList.add('hint');
            cardLabel.textContent = 'Свайпни вправо';
            cardLabel.style.display = 'block';
            swipeOverlay.classList.remove('right');

            // Восстановить структуру карточки (только формула)
            cardContent.innerHTML = `<div id="formula">H₂SO₄</div>`;
            
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            loadCard();
            startTimer();
        }

        function loadCard() {
            if (currentIndex >= deck.length) {
                deck = shuffleArray([...compounds]);
                currentIndex = 0;
            }
            const compound = deck[currentIndex];
            const formulaEl = document.getElementById('formula');
            if (formulaEl) formulaEl.textContent = compound.formula;
            
            card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
            card.style.transform = 'translateX(0) rotate(0)';
            card.style.opacity = '1';
            card.classList.remove('swiped-right', 'hint');
            swipeOverlay.classList.remove('right');
            
            card.style.transform = 'scale(0.95) translateX(0)';
            setTimeout(() => {
                card.style.transform = 'scale(1) translateX(0)';
            }, 50);
        }

        function swipeRight() {
            if (!isGameActive || isPaused) return;
            
            card.classList.remove('hint');
            card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
            card.classList.add('swiped-right');
            
            score++;
            scoreText.textContent = score;
            
            if (navigator.vibrate) navigator.vibrate(30);

            setTimeout(() => {
                currentIndex++;
                loadCard();
            }, 300);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused && isGameActive) {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerText.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 10) {
                timerText.style.color = '#ff00ff';
                timerText.style.textShadow = '0 0 10px #ff00ff';
            } else {
                timerText.style.color = '#fff';
                timerText.style.textShadow = 'none';
            }
        }

        function endGame() {
            isGameActive = false;
            clearInterval(timerInterval);
            card.classList.remove('hint');
            card.style.transform = 'translateX(0) rotate(0) scale(1)';
            card.style.opacity = '1';
            cardLabel.style.display = 'none';
            
            const grade = getGrade(score);
            
            // Заменяем содержимое карточки на результат
            cardContent.innerHTML = `
                <div class="result-score">Пройдено карточек: <b style="color:#fff">${score}</b></div>
                <div class="result-grade grade-${grade}">${grade}</div>
                <div class="result-label">Оценка</div>
            `;

            // Скрыть паузу и показать только "Заново"
            pauseBtn.classList.add('hidden-btn');
            resumeBtn.classList.add('hidden-btn');
            restartBtn.classList.remove('hidden-btn');
            restartBtn.textContent = 'Заново';
        }

        function pauseGame() {
            if (!isGameActive) return;
            isPaused = true;
            timerIcon.classList.add('paused');
            timerIcon.textContent = '⏸';
            
            pauseBtn.classList.add('hidden-btn');
            resumeBtn.classList.remove('hidden-btn');
            restartBtn.classList.remove('hidden-btn');
            
            card.style.transition = 'transform 0.3s ease';
            card.style.transform = 'translateX(0) rotate(0) scale(0.95)';
            card.classList.remove('hint');
        }

        function resumeGame() {
            if (!isGameActive) return;
            isPaused = false;
            timerIcon.classList.remove('paused');
            timerIcon.textContent = '⏱';
            
            pauseBtn.classList.remove('hidden-btn');
            resumeBtn.classList.add('hidden-btn');
            restartBtn.classList.add('hidden-btn');
            
            card.style.transform = 'translateX(0) rotate(0) scale(1)';
        }

        function returnToMenu() {
            isGameActive = false;
            isPaused = false;
            if (timerInterval) clearInterval(timerInterval);
            
            // Сброс кнопок
            pauseBtn.classList.remove('hidden-btn');
            resumeBtn.classList.add('hidden-btn');
            restartBtn.classList.add('hidden-btn');
            timerIcon.classList.remove('paused');
            timerIcon.textContent = '⏱';
            timerText.style.color = '#fff';
            timerText.style.textShadow = 'none';
            timerText.textContent = '01:00';
            scoreText.textContent = '0';
            
            // Сброс карточки
            card.style.transition = 'none';
            card.style.transform = 'translateX(0) rotate(0)';
            card.style.opacity = '1';
            card.classList.remove('swiped-right', 'hint');
            card.classList.add('hint');
            cardLabel.style.display = 'block';
            cardLabel.textContent = 'Свайпни вправо';
            swipeOverlay.classList.remove('right');
            cardContent.innerHTML = `<div id="formula">H₂SO₄</div>`;
            
            // Показать меню
            gameScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        }

        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', pauseGame);
        resumeBtn.addEventListener('click', resumeGame);
        restartBtn.addEventListener('click', returnToMenu);

        function handleStart(e) {
            if (!isGameActive || isPaused) return;
            isDragging = true;
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            currentX = startX;
            card.classList.remove('hint');
            card.style.transition = 'none';
            card.classList.add('swiping');
            swipeOverlay.classList.remove('right');
            e.preventDefault();
        }

        function handleMove(e) {
            if (!isDragging) return;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            currentX = clientX;
            const diff = currentX - startX;

            if (diff > 0) {
                card.style.transform = `translateX(${diff}px) rotate(${diff * 0.05}deg)`;
                swipeOverlay.classList.add('right');
            } else {
                card.style.transform = `translateX(${diff * 0.1}px)`;
                swipeOverlay.classList.remove('right');
            }
            e.preventDefault();
        }

        function handleEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            card.classList.remove('swiping');
            
            const diff = currentX - startX;
            const threshold = 100;

            if (diff > threshold) {
                swipeRight();
            } else {
                card.style.transition = 'transform 0.3s ease';
                card.style.transform = 'translateX(0) rotate(0)';
                swipeOverlay.classList.remove('right');
            }
        }

        card.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        card.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleEnd);

        document.body.addEventListener('touchmove', (e) => {
            if (isDragging) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
